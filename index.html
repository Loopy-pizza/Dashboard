<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코팅 설비 생산일지 대시보드</title>
  <!-- external css 연결 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>코팅 설비 생산일지 대시보드</h1>
      <p>CSV 파일(코팅 설비 생산일지)을 선택하면 실시간으로 분석 결과를 시각화합니다.</p>
    </header>

    <!-- 파일 업로드 영역 -->
    <section class="upload-section">
      <label for="csvFileInput" class="file-label">📂 CSV 파일 선택</label>
      <input type="file" id="csvFileInput" accept=".csv">
      <span id="fileName" class="file-name">선택된 파일 없음</span>
    </section>

    <!-- 1. 요약 카드 영역 -->
    <section class="cards-grid">
      <div class="card">
        <h3>총 롤 수</h3>
        <p id="totalRolls" class="card-value">-</p>
      </div>
      <div class="card">
        <h3>불량률</h3>
        <p id="defectRate" class="card-value">-</p>
      </div>
      <div class="card">
        <h3>가동률</h3>
        <p id="operatingRate" class="card-value">-</p>
      </div>
      <div class="card">
        <h3>총 로스시간</h3>
        <p id="totalLossTime" class="card-value">-</p>
      </div>
    </section>

    <!-- 2. 차트 영역 (가로 막대 차트) -->
    <section class="charts-grid">
      <div class="chart-box">
        <h2>설비별 생산 롤 수 (많은순)</h2>
        <div id="facilityChart" class="bar-chart-container">
          <p class="placeholder-text">CSV 파일을 선택해주세요.</p>
        </div>
      </div>
      <div class="chart-box">
        <h2>일자별 생산 롤 수 (날짜순)</h2>
        <div id="dailyChart" class="bar-chart-container">
          <p class="placeholder-text">CSV 파일을 선택해주세요.</p>
        </div>
      </div>
    </section>

    <!-- 3. 전체 롤 데이터 테이블 영역 -->
    <section class="table-section">
      <h2>전체 생산 롤 내역</h2>
      <div class="table-wrapper">
        <table id="dataTable">
          <thead>
            <tr id="tableHeader">
              <th>데이터 없음</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td>CSV 파일을 선택하면 데이터가 여기에 표시됩니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- external javascript 연결 -->
  <script src="js/dashboard.js"></script>
</body>
</html>
